<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <rect width="800" height="250" fill="#070711"/>

  <!-- Arka Plan Matrix Kodları (Yukarıdan Aşağı Akan) -->
  <g font-family="monospace" font-size="12" fill="#004d4d" opacity="0.6">
    <text x="80" y="-50"><tspan x="80" dy="15">1</tspan><tspan x="80" dy="15">0</tspan><tspan x="80" dy="15">1</tspan><tspan x="80" dy="15">1</tspan><tspan x="80" dy="15">0</tspan>
      <animate attributeName="y" values="-100;300" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="250" y="-50"><tspan x="250" dy="15">0</tspan><tspan x="250" dy="15">1</tspan><tspan x="250" dy="15">0</tspan><tspan x="250" dy="15">0</tspan>
      <animate attributeName="y" values="-50;350" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="550" y="-50"><tspan x="550" dy="15">1</tspan><tspan x="550" dy="15">1</tspan><tspan x="550" dy="15">0</tspan><tspan x="550" dy="15">1</tspan>
      <animate attributeName="y" values="-120;280" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="700" y="-50"><tspan x="700" dy="15">0</tspan><tspan x="700" dy="15">1</tspan><tspan x="700" dy="15">1</tspan>
      <animate attributeName="y" values="-20;300" dur="7s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Arka Planda Yanıp Sönen Siber Güvenlik Terimleri -->
  <g font-family="'Courier New', monospace" font-size="14" fill="#00ffff" opacity="0">
    <text x="80" y="60">> function decrypt(payload) {</text>
    <animate attributeName="opacity" values="0; 0.4; 0" dur="6s" repeatCount="indefinite" begin="1s"/>
  </g>
  <g font-family="'Courier New', monospace" font-size="14" fill="#00ffff" opacity="0">
    <text x="550" y="190">[SIFIRINCI-GÜN ZAYIFLIĞI]</text>
    <animate attributeName="opacity" values="0; 0.5; 0" dur="5s" repeatCount="indefinite" begin="0.5s"/>
  </g>
  <g font-family="'Courier New', monospace" font-size="14" fill="#00ffff" opacity="0">
    <text x="120" y="210">> firewall_bypass_init()</text>
    <animate attributeName="opacity" values="0; 0.6; 0" dur="4s" repeatCount="indefinite" begin="2s"/>
  </g>
  <g font-family="'Courier New', monospace" font-size="14" fill="#00ffff" opacity="0">
    <text x="520" y="60">> paket_analizi_aktif : 0xCC11A4</text>
    <animate attributeName="opacity" values="0; 0.5; 0" dur="7s" repeatCount="indefinite" begin="3s"/>
  </g>

  <!-- Neon Parlama Efekti -->
  <defs>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- GÜVEN ZENCİR Ana Metni (Glitch/Yanıp Sönme Animasyonlu) -->
  <text x="400" y="135" font-family="'Courier New', monospace" font-size="70" font-weight="900" fill="#00ffff" text-anchor="middle" filter="url(#neon)">
    GÜVEN ZENCİR
    <animate attributeName="opacity" values="1; 0.8; 1; 0.3; 1; 1; 0.9; 1; 1" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Alt Başlık -->
  <text x="400" y="175" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#0088cc" text-anchor="middle" letter-spacing="4">
    SİBER GÜVENLİK &amp; AĞ SAVUNMASI
  </text>

  <!-- Küçük Siber Glitch Çizgisi -->
  <rect x="250" y="120" width="80" height="3" fill="#00ffff" opacity="0">
    <animate attributeName="opacity" values="0; 1; 0; 0; 0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x" values="250; 450; 250" dur="0.15s" repeatCount="indefinite"/>
  </rect>
</svg>
