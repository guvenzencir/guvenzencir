<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
 <title id="title">Güven Zencir — Blue Team &amp; Backend</title>
 <desc id="desc">Computer Engineering student at Kayseri University. Animated radar and terminal, building NetGuard.</desc>
 <style>
 text{font-family:ui-monospace,'DejaVu Sans Mono',Consolas,monospace;fill:#e6edf3}
 .muted{fill:#9baec1}.accent{fill:#26e6db}
 .cursor{animation:blink 1.2s steps(2,end) infinite}
 .scan{transform-origin:770px 146px;animation:spin 10s linear infinite}
 .pulse{animation:pulse 3s ease-in-out infinite}
 .packet{animation:travel 4s linear infinite}
 .packet2{animation-delay:-1.3s}.packet3{animation-delay:-2.6s}
 .s1{animation:status1 12s steps(1,end) infinite}
 .s2{opacity:0;animation:status2 12s steps(1,end) infinite}
 .s3{opacity:0;animation:status3 12s steps(1,end) infinite}
 @keyframes blink{50%{opacity:0}}
 @keyframes spin{to{transform:rotate(360deg)}}
 @keyframes pulse{50%{opacity:.4}}
 @keyframes travel{0%{transform:translateX(0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translateX(720px);opacity:0}}
 @keyframes status1{0%,100%{opacity:1}33.33%{opacity:0}}
 @keyframes status2{0%,66.66%,100%{opacity:0}33.33%{opacity:1}}
 @keyframes status3{0%,100%{opacity:0}66.66%{opacity:1}}
 @media(prefers-reduced-motion:reduce){.scan,.pulse,.cursor,.packet,.s1,.s2,.s3{animation:none}.packet,.s2,.s3{display:none}}
 </style>
 <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#2c3d4a" stroke-width=".6" opacity=".35"/></pattern><clipPath id="clip"><rect width="958" height="328" x="1" y="1" rx="20"/></clipPath></defs>
