<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-labelledby="title desc">
 <title id="title">NetGuard — illustrative network packet animation</title><desc id="desc">Packets pass through an IDS. Normal traffic continues; suspicious traffic is flagged. This is a decorative animation, not live telemetry.</desc><style>
 text{font-family:ui-monospace,'DejaVu Sans Mono',Consolas,monospace;fill:#172b3a}
 .muted{fill:#526474}.accent{fill:#087f8c}
 .cursor{animation:blink 1.2s steps(2,end) infinite}
 .scan{transform-origin:770px 146px;animation:spin 10s linear infinite}
 .pulse{animation:pulse 3s ease-in-out infinite}
 .packet{animation:travel 4s linear infinite}
 .packet2{animation-delay:-1.3s}.packet3{animation-delay:-2.6s}
 .s1{animation:status1 12s steps(1,end) infinite}
 .s2{opacity:0;animation:status2 12s steps(1,end) infinite}
 .s3{opacity:0;animation:status3 12s steps(1,end) infinite}
 @keyframes blink{50%{opacity:0}}
 @keyframes spin{to{transform:rotate(360deg)}}
 @keyframes pulse{50%{opacity:.4}}
 @keyframes travel{0%{transform:translateX(0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translateX(720px);opacity:0}}
 @keyframes status1{0%,100%{opacity:1}33.33%{opacity:0}}
 @keyframes status2{0%,66.66%,100%{opacity:0}33.33%{opacity:1}}
 @keyframes status3{0%,100%{opacity:0}66.66%{opacity:1}}
 @media(prefers-reduced-motion:reduce){.scan,.pulse,.cursor,.packet,.s1,.s2,.s3{animation:none}.packet,.suspicious,.s2,.s3{display:none}}
 </style>
 <rect x="1" y="1" width="958" height="208" rx="16" fill="#f6f8fa" stroke="#cddbe2"/>
 <text x="28" y="32" font-size="12" class="accent">NETWORK DEFENSE / NETGUARD</text>
 <text x="932" y="32" text-anchor="end" font-size="10" class="muted">ILLUSTRATIVE FLOW</text>
 <path d="M105 92H810M105 145H810" stroke="#cddbe2" stroke-width="2" fill="none"/>
 <g fill="#087f8c"><rect class="packet" x="105" y="85" width="17" height="14" rx="3"/><rect class="packet packet2" x="105" y="85" width="17" height="14" rx="3"/><rect class="packet packet3" x="105" y="85" width="17" height="14" rx="3"/></g>
 <path class="suspicious" d="M105 138h17v14h-17z" fill="#b42332"><animateTransform attributeName="transform" type="translate" values="0 0;345 0;345 0" keyTimes="0;0.6;1" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.6;1" dur="4s" repeatCount="indefinite"/></path>
 <rect x="383" y="64" width="190" height="108" rx="12" fill="#ffffff" stroke="#087f8c"/>
 <text x="478" y="100" text-anchor="middle" font-size="22" font-weight="700">IDS</text><text x="478" y="124" text-anchor="middle" font-size="12" class="muted">ML model analysis</text><text x="478" y="150" text-anchor="middle" font-size="10" class="accent">DETECT / FLAG</text>
 <text x="28" y="97" font-size="11" class="muted">TRAFFIC</text><text x="836" y="97" font-size="11" class="accent">NORMAL</text><text x="836" y="150" font-size="11" fill="#b42332" style="fill:#b42332">FLAGGED</text>
 <path d="M583 140l8 10m0-10l-8 10" stroke="#b42332" stroke-width="2"/>
 <text x="28" y="191" font-size="10" class="muted">Network traffic → feature processing → model prediction → analysis</text>
 </svg>