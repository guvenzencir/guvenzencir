<svg xmlns="http://www.w3.org/2000/svg" width="960" height="85" viewBox="0 0 960 85" role="img" aria-labelledby="title desc"><title id="title">Observe. Investigate. Defend.</title><desc id="desc">Stay curious. Keep learning. Build your defense.</desc><style>text{font-family:'DejaVu Sans Mono',Consolas,monospace;fill:#132d46}.m{fill:#4d667c}.c{fill:#007d8b}.b{fill:#245ac7}.g{fill:#127348}
 .pulse{animation:pulse 2.4s ease-in-out infinite}.cursor{animation:blink 1s steps(2,end) infinite}.scan{animation:scan 5s linear infinite}.flow{stroke-dasharray:8 12;animation:flow 1.2s linear infinite}
 .s1{animation:s1 12s steps(1,end) infinite}.s2{opacity:0;animation:s2 12s steps(1,end) infinite}.s3{opacity:0;animation:s3 12s steps(1,end) infinite}
 @keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}@keyframes scan{0%{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.8}100%{transform:translateY(190px);opacity:0}}@keyframes flow{to{stroke-dashoffset:-40}}
 @keyframes s1{0%,100%{opacity:1}33.33%{opacity:0}}@keyframes s2{0%,66.66%,100%{opacity:0}33.33%{opacity:1}}@keyframes s3{0%,100%{opacity:0}66.66%{opacity:1}}
 @media(prefers-reduced-motion:reduce){.pulse,.cursor,.scan,.flow,.s1,.s2,.s3{animation:none}.scan,.s2,.s3{display:none}}
 </style><defs><filter id="glow" x="-25%" y="-50%" width="150%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#bfd5e5" stroke-width=".6" opacity=".45"/></pattern></defs><rect x="1" y="1" width="958" height="83" rx="20" fill="#f4f9fc" stroke="#bfd5e5"/><path d="M28 24H190M770 24H932" stroke="#007d8b" class="flow"/><text x="480" y="32" text-anchor="middle" font-size="14" font-weight="700" class="c">OBSERVE. INVESTIGATE. DEFEND.</text><text x="480" y="62" text-anchor="middle" font-size="11" class="m">Stay curious. Keep learning. Build your defense.</text></svg>